<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tahir Bulut Sürücü Kursu | Ödeme Bilgileri</title>
<style>
  :root {
    --bg: #0f1114;
    --ink: #ffffff;
    --muted: rgba(255,255,255,.62);
    --line: rgba(255,255,255,.14);
    --red: #e30613;
    --red-dark: #b8050f;
    --card: rgba(18,20,24,.62);
    --font: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { min-height: 100%; max-width: 100%; overflow-x: hidden; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: var(--font);
    color: var(--ink);
    background: var(--bg);
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; min-height: 100dvh;
    padding: 24px 0;
    overflow-x: hidden;
  }

  /* ---------- Arka plan: yol, şerit çizgileri, otomobil ---------- */
  .scene { position: fixed; inset: 0; z-index: 0; overflow: hidden; }
  .scene::before { /* gökyüzü / şehir ışığı */
    content: ""; position: absolute; inset: 0;
    background:
      radial-gradient(80% 50% at 50% 38%, rgba(227,6,19,.16), transparent 70%),
      linear-gradient(180deg, #1b1f26 0%, #121418 55%, #0b0c0e 100%);
  }
  .skyline { position: absolute; left: 0; right: 0; bottom: 38%; width: 100%; height: 24%; opacity: .7; filter: blur(1px); }
  .road {
    position: absolute; left: 0; right: 0; bottom: 0; height: 38%;
    background: linear-gradient(180deg, #181a1f, #0c0d10);
    border-top: 2px solid rgba(255,255,255,.08);
  }
  .road::before { /* orta şerit */
    content: ""; position: absolute; left: 0; right: 0; top: 52%; height: 6px;
    background: repeating-linear-gradient(90deg, rgba(255,255,255,.85) 0 70px, transparent 70px 140px);
    animation: lane 5s linear infinite; opacity: .55;
  }
  .road::after { /* yol kenarı */
    content: ""; position: absolute; left: 0; right: 0; bottom: 14%; height: 3px;
    background: rgba(255,255,255,.18);
  }
  .car { position: absolute; bottom: 8%; left: 50%; width: min(620px, 94vw); transform: translateX(-50%); opacity: .95; }
  .scene .overlay { position: absolute; inset: 0; background: radial-gradient(120% 90% at 50% 45%, rgba(8,9,11,.5), rgba(4,5,6,.82)); }
  @keyframes lane { to { background-position: -140px 0; } }

  /* Atmosfer: bokeh ışıkları */
  .bokeh { position: absolute; left: 0; right: 0; bottom: 30%; height: 22%; filter: blur(5px); opacity: .6;
    background:
      radial-gradient(circle 9px at 8% 60%, rgba(255,214,150,.9), transparent 70%),
      radial-gradient(circle 12px at 17% 30%, rgba(255,255,255,.7), transparent 70%),
      radial-gradient(circle 8px at 29% 70%, rgba(227,6,19,.85), transparent 70%),
      radial-gradient(circle 11px at 41% 40%, rgba(255,230,180,.8), transparent 70%),
      radial-gradient(circle 8px at 55% 65%, rgba(255,255,255,.7), transparent 70%),
      radial-gradient(circle 12px at 66% 35%, rgba(227,6,19,.7), transparent 70%),
      radial-gradient(circle 9px at 78% 60%, rgba(255,214,150,.9), transparent 70%),
      radial-gradient(circle 11px at 90% 40%, rgba(255,255,255,.7), transparent 70%); }

  /* Üst bölüm: direksiyonlar ve trafik levhaları */
  .deco { position: absolute; inset: 0 0 0 0; pointer-events: none; }
  .beam { position: absolute; left: 0; right: 0; top: 0; height: 14px;
    background: linear-gradient(180deg, #5b6068, #2a2d33 55%, #131417);
    box-shadow: 0 8px 18px rgba(0,0,0,.6); }
  .deco svg.sign { position: absolute; display: block; filter: drop-shadow(0 8px 8px rgba(0,0,0,.6)) saturate(.85) brightness(.88); }
  .deco .g { width: clamp(52px, 7vw, 86px); top: 10px; }
  .deco .g1 { left: 20%; } .deco .g2 { left: 38%; } .deco .g3 { left: 57%; } .deco .g4 { left: 75%; }
  .post { position: absolute; top: 20%; bottom: 38%; width: clamp(54px, 6vw, 74px); display: flex; flex-direction: column; align-items: center; filter: saturate(.85) brightness(.85); }
  .post svg { width: 100%; display: block; filter: drop-shadow(0 6px 6px rgba(0,0,0,.55)); }
  .post i { flex: 1; width: 6px; background: linear-gradient(90deg, #2a2d33, #8b9098 45%, #2a2d33); }
  .post.l { left: 5%; } .post.r { right: 5%; }
  .wheel { position: absolute; color: #000; filter: blur(1.5px) brightness(.8); opacity: .55; }
  .w1 { width: clamp(190px, 26vw, 360px); left: -7%; top: -8%; transform: rotate(-14deg); }
  .w2 { width: clamp(150px, 20vw, 280px); right: -5%; top: 6%; transform: rotate(18deg); }
  @media (max-width: 639px) {
    .post { display: none; }
    .deco .g { width: 44px; }
    .deco .g1 { left: 14%; } .deco .g2 { left: 36%; } .deco .g3 { left: 58%; } .deco .g4 { left: 80%; }
    .scene .overlay { background: radial-gradient(120% 90% at 50% 45%, rgba(8,9,11,.3), rgba(4,5,6,.7)); }
    .wheel { opacity: .95; filter: blur(.8px) brightness(1.7); }
    .w1 { width: 230px; left: -135px; top: 11%; }
    .w2 { width: 210px; right: -125px; top: 34%; }
    .skyline, .bokeh { opacity: .9; }
    .car { bottom: 1.5%; width: 86vw; }
  }

  /* ---------- Kart ---------- */
  main { position: relative; z-index: 1; width: 90%; max-width: 480px; }
  .card {
    background: var(--card);
    -webkit-backdrop-filter: blur(18px) saturate(140%);
    backdrop-filter: blur(18px) saturate(140%);
    border: 1px solid var(--line);
    border-radius: 26px;
    box-shadow: 0 30px 70px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.08);
    padding: clamp(22px, 5vw, 36px);
    text-align: center;
    animation: enter .7s cubic-bezier(.2,.8,.2,1) both;
  }
  @keyframes enter { from { opacity: 0; transform: translateY(26px); } to { opacity: 1; transform: none; } }

  .plate { /* direksiyon/plaka hissi veren başlık */
    display: inline-flex; align-items: center; gap: 10px;
    margin-bottom: 20px;
  }
  .plate svg { width: 30px; height: 30px; flex: none; color: var(--red); }
  h1 {
    font-size: clamp(1.05rem, 4.6vw, 1.45rem);
    font-weight: 800; letter-spacing: .04em; line-height: 1.2;
  }

  .bank {
    display: flex; align-items: center; justify-content: center;
    background: #fff; border-radius: 16px; margin: 0 auto 22px; padding: 14px 22px; max-width: 320px;
    box-shadow: inset 0 0 0 1px rgba(0,0,0,.06);
  }
  .bank .lockup { display: flex; align-items: center; gap: 14px; }
  .bank img { height: 76px; width: auto; display: block; }
  .bank .bank-name { color: #1a1a1a; font-weight: 800; font-size: 1.35rem; letter-spacing: -.01em; line-height: 1.1; text-align: left; }
  .bank .bank-name b { color: var(--red); display: block; }
  .bank .wordmark { display: flex; align-items: center; gap: 10px; color: #1a1a1a; font-weight: 800; font-size: 1.25rem; letter-spacing: -.01em; }
  .bank .wordmark i { width: 14px; height: 34px; background: var(--red); border-radius: 3px; display: block; }
  .bank .wordmark span b { color: var(--red); }

  .section-title {
    display: flex; align-items: center; gap: 12px; margin-bottom: 18px;
    font-size: .78rem; font-weight: 700; letter-spacing: .18em; color: var(--muted);
  }
  .section-title::before, .section-title::after { content: ""; flex: 1; height: 1px; background: var(--line); }

  .field {
    min-width: 0; text-align: left;
    background: rgba(255,255,255,.05);
    border: 1px solid var(--line);
    border-left: 3px solid var(--red);
    border-radius: 16px;
    padding: 16px; margin-bottom: 14px;
  }
  .field:last-child { margin-bottom: 0; }
  .label { font-size: .78rem; color: var(--muted); margin-bottom: 6px; }
  .value { font-weight: 700; font-size: 1.25rem; word-break: break-word; }
  .value.iban {
    font-size: clamp(.72rem, 3.6vw, 1.3rem);
    letter-spacing: 0; white-space: nowrap; font-variant-numeric: tabular-nums; min-width: 0;
  }

  .btn {
    margin-top: 14px; width: 100%;
    display: inline-flex; align-items: center; justify-content: center; gap: 9px;
    font: inherit; font-weight: 700; font-size: .95rem; color: #fff;
    background: linear-gradient(180deg, var(--red), var(--red-dark));
    border: 0; border-radius: 12px; padding: 13px 18px; cursor: pointer;
    box-shadow: 0 8px 20px rgba(227,6,19,.28);
    transition: transform .18s ease, box-shadow .18s ease, background .18s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .btn svg { width: 18px; height: 18px; transition: transform .18s ease; }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 12px 26px rgba(227,6,19,.4); }
  .btn:hover svg { transform: scale(1.12) rotate(-6deg); }
  .btn:active { transform: translateY(1px) scale(.98); box-shadow: 0 4px 10px rgba(227,6,19,.3); }
  .btn:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
  .btn.done { background: linear-gradient(180deg, #1f9d55, #17803f); box-shadow: 0 8px 20px rgba(31,157,85,.3); }

  @media (min-width: 640px) { .btn { width: auto; min-width: 200px; } }
  @media (prefers-reduced-motion: reduce) {
    .card { animation: none; } .road::before { animation: none; }
    .btn, .btn svg { transition: none; }
  }
</style>
</head>
<body>

<!-- Arka plan -->
<div class="scene" aria-hidden="true">
  <svg class="skyline" viewBox="0 0 1200 200" preserveAspectRatio="none">
    <defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1a1d22"/><stop offset="1" stop-color="#0b0c0e"/></linearGradient></defs>

  <!-- Gerçekçi sedan (eğitim aracı) -->

      <linearGradient id="body" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#454a53"/><stop offset=".45" stop-color="#20242a"/><stop offset="1" stop-color="#0c0d10"/></linearGradient>

      <radialGradient id="rim" cx=".4" cy=".35" r=".8"><stop offset="0" stop-color="#e5e8ec"/><stop offset=".6" stop-color="#8d939b"/><stop offset="1" stop-color="#3a3e45"/></radialGradient>
      <radialGradient id="beam" cx="0" cy=".5" r="1"><stop offset="0" stop-color="#fff6dc" stop-opacity=".85"/><stop offset="1" stop-color="#fff6dc" stop-opacity="0"/></radialGradient>

    <path d="M330 78l24-24" stroke="rgba(255,255,255,.14)" stroke-width="4"/>
    <!-- kapı çizgileri ve kol -->
    <path d="M296 54v70M180 92l6 34M420 90l-8 36" stroke="rgba(0,0,0,.55)" stroke-width="1.6"/>
    <rect x="258" y="100" width="22" height="4" rx="2" fill="#aeb3ba"/><rect x="332" y="100" width="22" height="4" rx="2" fill="#aeb3ba"/>
    <!-- ayna -->
    <path d="M410 88l16-2 4 8-18 2z" fill="#14161a"/>
    <!-- çatı tabelası -->
    <rect x="272" y="38" width="48" height="13" rx="2" fill="#e8eaec"/><text x="296" y="48" text-anchor="middle" font-family="Arial" font-weight="700" font-size="8" fill="#b3101a">EHLİYET</text>
    <!-- tekerlek kemerleri ve tekerlekler -->
    <circle cx="136" cy="138" r="37" fill="#050506"/><circle cx="470" cy="138" r="37" fill="#050506"/>
    <use href="#wh" x="136" y="138"/><use href="#wh" x="470" y="138"/>
    <!-- farlar -->
    <path d="M556 104c8 0 14 2 16 8l-26 2z" fill="#fff7de"/>
    <path d="M28 112c-2 6 0 12 8 14l12-2v-10z" fill="#b30f1a"/>
  </svg>

  <div class="overlay"></div>

  <div class="deco">
    <svg width="0" height="0" style="position:absolute">
      <defs>
        <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#fff" stop-opacity=".38"/><stop offset=".45" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".32"/>
        </linearGradient>
        <linearGradient id="leather" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3a3d43"/><stop offset="1" stop-color="#0a0b0c"/></linearGradient>
        <radialGradient id="hub" cx=".4" cy=".35" r=".8"><stop offset="0" stop-color="#5a5f68"/><stop offset="1" stop-color="#16171a"/></radialGradient>
        <symbol id="wheelsym" viewBox="0 0 200 200">
          <path d="M26 104h148M100 112v78" stroke="#1b1d21" stroke-width="24" stroke-linecap="round" fill="none"/>
          <circle cx="100" cy="100" r="88" fill="none" stroke="url(#leather)" stroke-width="20"/>
          <circle cx="100" cy="100" r="88" fill="none" stroke="#fff" stroke-opacity=".28" stroke-width="1.4" stroke-dasharray="4 3"/>
          <path d="M20 84A82 82 0 0 1 72 24" fill="none" stroke="#fff" stroke-opacity=".18" stroke-width="3" stroke-linecap="round"/>
          <circle cx="100" cy="100" r="26" fill="url(#hub)"/>
          <path d="M100 8v14" stroke="#c4161c" stroke-width="5" stroke-linecap="round"/>
        </symbol>
      </defs>
    </svg>

    <svg class="wheel w1" viewBox="0 0 200 200"><use href="#wheelsym"/></svg>
    <svg class="wheel w2" viewBox="0 0 200 200"><use href="#wheelsym"/></svg>

    <div class="beam"></div>

    <!-- DUR -->
    <svg class="sign g g1" viewBox="0 0 100 124"><path d="M28 0v22M72 0v22" stroke="#3a3d43" stroke-width="4"/>
      <polygon points="31,24 69,24 96,51 96,89 69,116 31,116 4,89 4,51" fill="#d6d9dc"/>
      <polygon points="32.5,27 67.5,27 93,52.5 93,87.5 67.5,113 32.5,113 7,87.5 7,52.5" fill="#fff"/>
      <polygon points="34,31 66,31 89,54 89,86 66,109 34,109 11,86 11,54" fill="#c4161c"/>

      <circle cx="50" cy="72" r="47" fill="#d6d9dc"/><circle cx="50" cy="72" r="44" fill="#f4f4f2"/>
      <circle cx="50" cy="72" r="36" fill="none" stroke="#c4161c" stroke-width="10"/>
      <text x="50" y="84" text-anchor="middle" font-family="Arial Narrow,Arial,sans-serif" font-weight="700" font-size="34" fill="#15171a">50</text>
      <circle cx="50" cy="72" r="47" fill="url(#sheen)"/></svg>

    <!-- Yol ver -->
    <svg class="sign g g3" viewBox="0 0 100 124"><path d="M28 0v28M72 0v28" stroke="#3a3d43" stroke-width="4"/>
      <polygon points="50,120 3,32 97,32" fill="#d6d9dc" stroke="#d6d9dc" stroke-width="4" stroke-linejoin="round"/>
      <polygon points="50,110 14,38 86,38" fill="#f4f4f2" stroke="#c4161c" stroke-width="9" stroke-linejoin="round"/>
      <polygon points="50,120 3,32 97,32" fill="url(#sheen)" stroke="none"/></svg>

    <!-- Park -->
    <svg class="sign g g4" viewBox="0 0 100 124"><path d="M28 0v24M72 0v24" stroke="#3a3d43" stroke-width="4"/>
      <rect x="6" y="26" width="88" height="88" rx="9" fill="#d6d9dc"/><rect x="9.5" y="29.5" width="81" height="81" rx="6" fill="#0d4a9e"/>
      <rect x="13" y="33" width="74" height="74" rx="4" fill="none" stroke="#fff" stroke-width="2"/>
      <text x="50" y="94" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700" font-size="62" fill="#fff">P</text>
      <rect x="6" y="26" width="88" height="88" rx="9" fill="url(#sheen)"/></svg>

    <!-- Yan direkler -->
    <div class="post l">
      <svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="47" fill="#d6d9dc"/><circle cx="50" cy="50" r="44" fill="#b8121c"/>
        <rect x="20" y="42" width="60" height="16" rx="2" fill="#f4f4f2"/><circle cx="50" cy="50" r="47" fill="url(#sheen)"/></svg><i></i>

<main>
  <section class="card" aria-labelledby="site-title">
    <div class="plate">
      <!-- Direksiyon ikonu -->
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="2.5"/>
        <path d="M12 14.5V21M9.6 11l-6.5-1.3M14.4 11l6.5-1.3"/>
      </svg>
      <h1 id="site-title"></h1>
    </div>

    <!-- Banka logosu: LOGO_SRC doldurulursa görsel görünür, boşsa temiz bir yazı logosu gösterilir -->
    <div class="bank" id="bank"></div>

    <div class="section-title">ÖDEME BİLGİLERİ</div>

    <div class="field">
      <div class="label">İsim Soyisim</div>
      <div class="value" id="name"></div>
      <button class="btn" id="copyName" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        <span>İsmi Kopyala</span>
      </button>
    </div>

    <div class="field">
      <div class="label">IBAN</div>
      <div class="value iban" id="iban"></div>
      <button class="btn" id="copyIban" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        <span>IBAN'ı Kopyala</span>
      </button>
    </div>
  </section>
</main>

<script>
  /* ============ KOLAYCA DEĞİŞTİRİLEBİLİR AYARLAR ============ */
  const siteName    = "TAHİR BULUT SÜRÜCÜ KURSU";
  const accountName = "TAHİR BULUT MOTORLU TAŞITLAR SÜRÜCÜ KURSU SAN VE TİC. LTD. ŞTİ.";

  const showBankName = true;           // Logonun yanındaki "Ziraat Bankası" yazısı (false: yalnızca logo)
  const bankName    = "Ziraat Bankası";
  /* ========================================================== */

  const $ = (id) => document.getElementById(id);

  document.title = accountName + " | Ödeme Bilgileri";
  $("site-title").textContent = siteName;
  $("name").textContent = accountName;
  $("iban").textContent = iban;

  // Banka logosu
  const bank = $("bank");
  function showWordmark() {
    bank.innerHTML = '<div class="wordmark" role="img" aria-label="' + bankName + '"><i></i><span>Ziraat <b>Bankası</b></span></div>';
  }
  if (LOGO_SRC) {
    const lockup = document.createElement("div");
    lockup.className = "lockup";
    const img = new Image();
    img.alt = showBankName ? "" : bankName;
    img.onerror = showWordmark;
    img.src = LOGO_SRC;
    lockup.appendChild(img);
    if (showBankName) {
      const t = document.createElement("div");
      t.className = "bank-name";
      t.innerHTML = "Ziraat<b>Bankası</b>";
      lockup.appendChild(t);
    }
    bank.appendChild(lockup);
  } else { showWordmark(); }
  // IBAN ekran genişliğine sığana kadar küçülsün
  function fitIban() {
    const el = $("iban");
    el.style.fontSize = "";
    let size = parseFloat(getComputedStyle(el).fontSize);
    while (el.scrollWidth > el.clientWidth && size > 9) { size -= 0.5; el.style.fontSize = size + "px"; }
  }
  fitIban();
  window.addEventListener("resize", fitIban);
  window.addEventListener("orientationchange", fitIban);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitIban);

  // Kopyalama
  async function copyText(text) {
    try {
      await navigator.clipboard.writeText(text);
    } catch (e) { // eski tarayıcılar / http için yedek
      const t = document.createElement("textarea");
      t.value = text; t.setAttribute("readonly", ""); t.style.position = "fixed"; t.style.opacity = "0";
      document.body.appendChild(t); t.select(); document.execCommand("copy"); document.body.removeChild(t);
    }
  }

  function bindCopy(buttonId, getText) {
    const btn = $(buttonId), label = btn.querySelector("span"), original = label.textContent;
    let timer;
    btn.addEventListener("click", async () => {
      await copyText(getText());
      label.textContent = "✓ Kopyalandı";
      btn.classList.add("done");
      clearTimeout(timer);
      timer = setTimeout(() => { label.textContent = original; btn.classList.remove("done"); }, 1800);
    });
  }

  bindCopy("copyName", () => accountName);
  bindCopy("copyIban", () => copyIbanWithoutSpaces ? iban.replace(/\s+/g, "") : iban);
</script>
